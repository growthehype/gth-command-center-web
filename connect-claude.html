<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Connect Claude · Command Center</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: #000; color: #ECE9E3; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .card { width: 100%; max-width: 420px; padding: 32px 28px; border-radius: 20px; border: 1px solid rgba(255,255,255,.1); background: linear-gradient(180deg, #0E0E0E, #060606); }
      .logo { width: 44px; height: 44px; margin-bottom: 22px; }
      h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
      p { color: #A7A39C; }
      ul { margin: 18px 0 22px; padding: 0; list-style: none; display: grid; gap: 9px; }
      li { display: flex; gap: 10px; font-size: 14px; color: #D6D2CB; }
      li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: #fff; }
      li.no::before { background: transparent; border: 1px solid #77736C; }
      .who { font-size: 13px; color: #8A8680; margin-bottom: 18px; }
      button, a.btn { display: block; width: 100%; padding: 14px; border-radius: 999px; border: 0; font: 700 14px/1 inherit; letter-spacing: .02em; text-align: center; text-decoration: none; cursor: pointer; }
      .primary { background: #fff; color: #000; }
      .ghost { margin-top: 10px; background: transparent; color: #A7A39C; border: 1px solid rgba(255,255,255,.14); }
      .err { margin-top: 14px; color: #F06A5F; font-size: 13.5px; }
      button[disabled] { opacity: .6; cursor: default; }
    </style>
  </head>
  <body>
    <main class="card" id="app"><p>Loading…</p></main>
    <script type="module" src="/src/connect-claude.ts"></script>
  </body>
</html>
