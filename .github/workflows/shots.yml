name: concept-lab-shots
on:
  push:
    branches: [concept-lab]
    paths: ['lab/shots.txt']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Screenshot each "name url" in lab/shots.txt
        run: node lab/shoot.mjs
      - name: Commit
        run: |
          git config user.name "concept-lab"
          git config user.email "concept-lab@users.noreply.github.com"
          git add lab/shots
          git commit -m "Screenshots" || echo "nothing new"
          git pull --rebase -q || true
          git push
